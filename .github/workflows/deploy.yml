name: CD Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Deploy & Smoke Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production # Environnement protégé GitHub Actions

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Permet d'obtenir le tag précédent pour le rollback éventuel

      - name: Création d'un .env.local pour l'environnement CD
        run: touch .env.local

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Authentification AWS via secrets IAM
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Installation des dépendances
        run: npm ci

      - name: Build des archives Lambdas
        run: npm run build:lambdas

      - name: Build et Push des images ECR
        run: |
          ./scripts/deploy/build-and-push.sh \
            "${{ env.AWS_REGION }}" \
            "${{ vars.ECR_APP_URL }}" \
            "${{ vars.ECR_COLLAB_URL }}"

      - name: Déploiement sur EC2 via SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          ./scripts/deploy/deploy-ec2.sh "${GIT_SHA}" "${{ vars.EC2_INSTANCE_ID }}" "${{ env.AWS_REGION }}"

      - name: Mise à jour du code des fonctions Lambda
        run: |
          PREFIX="${{ vars.PROJECT_PREFIX || 'editeur-collab-dev' }}"
          for lambda in download-api pdf-worker pdf-dlq-handler notifier reconciler; do
            echo "--> Mise à jour du code de la Lambda ${PREFIX}-${lambda}..."
            aws lambda update-function-code \
              --function-name "${PREFIX}-${lambda}" \
              --zip-file "fileb://dist/lambdas/${lambda}.zip" \
              --region "${{ env.AWS_REGION }}"
          done

      - name: Exécution du test de fumée (Smoke Test) contre CloudFront
        run: |
          PREV_TAG=$(git rev-parse --short HEAD~1 2>/dev/null || echo "latest")
          TARGET_URL="${{ vars.CLOUDFRONT_URL }}"
          if [ -z "${TARGET_URL}" ]; then
            echo "--> CLOUDFRONT_URL non renseigné, détection automatique via AWS CloudFront..."
            CF_DOMAIN=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[0].DomainName" \
              --output text 2>/dev/null || true)
            if [ -n "${CF_DOMAIN}" ] && [ "${CF_DOMAIN}" != "None" ]; then
              TARGET_URL="https://${CF_DOMAIN}"
              echo "--> Domaine CloudFront détecté : ${TARGET_URL}"
            fi
          fi

          if [ -z "${TARGET_URL}" ]; then
            echo "::error::CLOUDFRONT_URL est requis pour exécuter le smoke test."
            exit 1
          fi

          if ! npm run smoke -- --base-url "${TARGET_URL}"; then
            echo "::error::Le smoke test a échoué. Déclenchez le retour arrière immédiat :"
            echo "::error::./scripts/deploy/rollback-ec2.sh ${PREV_TAG} ${{ vars.EC2_INSTANCE_ID }} ${{ env.AWS_REGION }}"
            exit 1
          fi
