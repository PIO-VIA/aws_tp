include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  pdf-jobs {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "pdf-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  pdf-jobs-dlq {
    defaultVisibilityTimeout = 30 seconds
    messageRetentionPeriod = 14 days
  }
}
